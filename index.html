            position: relative;

        /* CRT Screen Effects */
        .crt-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
        }

        .scanlines {
            background: repeating-linear-gradient(

                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            );
            animation: scanline-move 0.1s linear infinite;
        }

        .scanlines::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                180deg,
                rgba(0, 0, 0, 0.3) 0%,
                transparent 50%,
                rgba(0, 0, 0, 0.3) 100%
            );
        }

        @keyframes scanline-move {
            0% { transform: translateY(0); }
            100% { transform: translateY(2px); }

        .flicker {
            animation: flicker 0.15s infinite;
        }

        @keyframes flicker {
            0% { opacity: 0.97; }
            5% { opacity: 0.9; }
            10% { opacity: 0.95; }
            15% { opacity: 0.98; }
            20% { opacity: 0.93; }
            25% { opacity: 0.96; }
            30% { opacity: 0.99; }
            35% { opacity: 0.92; }
            40% { opacity: 0.97; }
            45% { opacity: 0.94; }

            55% { opacity: 0.91; }
            60% { opacity: 0.96; }
            65% { opacity: 0.99; }
            70% { opacity: 0.93; }
            75% { opacity: 0.97; }
            80% { opacity: 0.95; }
            85% { opacity: 0.98; }
            90% { opacity: 0.92; }
            95% { opacity: 0.96; }
            100% { opacity: 0.99; }

        }

        .screen-curve {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9998;
            background: radial-gradient(
                ellipse at center,

            padding: 20px;

            scrollbar-width: thin;
            scrollbar-color: var(--phosphor-secondary) var(--bg-color);

        }

        .terminal::-webkit-scrollbar-track {

        }

                    canvas.id = 'matrix-canvas';
                    canvas.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;z-index:10000;background:#000;';
                    document.body.appendChild(canvas);

                    const ctx = canvas.getContext('2d');
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;

                    const chars = '01アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン';
                    const fontSize = 14;
                    const columns = canvas.width / fontSize;
                    const drops = Array(Math.floor(columns)).fill(1);

                    function drawMatrix() {
                        ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
                        ctx.fillRect(0, 0, canvas.width, canvas.height);

                        ctx.fillStyle = '#0F0';
                        ctx.font = fontSize + 'px monospace';

                        for (let i = 0; i < drops.length; i++) {
                            const text = chars[Math.floor(Math.random() * chars.length)];
                            ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                            if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                                drops[i] = 0;
                            }
                            drops[i]++;
                        }
                    }

                    const matrixInterval = setInterval(drawMatrix, 33);

                    setTimeout(() => {
                        clearInterval(matrixInterval);
                        canvas.remove();
                        return '<div class="output-line success">You took the red pill. Welcome back.</div>';

            terminal.scrollTop = terminal.scrollHeight;

        function executeCommand(cmd) {
            const trimmedCmd = cmd.trim().toLowerCase();
            const [command, ...args] = trimmedCmd.split(' ');

            addOutput(`<span class="command">guest@portfolio:~$ ${cmd}</span>`, 'command');

            if (command === '') return;

            if (commands[command]) {
                const result = commands[command].action();
                if (result !== null) {

                }
            } else {
                addOutput(`<span class="error">Command not found: ${command}. Type 'help' for available commands.</span>`, 'error');

        }
