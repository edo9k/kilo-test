                transparent 2px
            );
            animation: scanline-move 0.1s linear infinite;
        }

        .scanlines::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                180deg,
                rgba(0, 0, 0, 0.3) 0%,
                transparent 50%,
                rgba(0, 0, 0, 0.3) 100%

        }

            animation: flicker 0.15s infinite;
        }

            0% { opacity: 0.97; }

            65% { opacity: 0.99; }
            70% { opacity: 0.93; }
            75% { opacity: 0.97; }
            80% { opacity: 0.95; }
            85% { opacity: 0.98; }
            90% { opacity: 0.92; }
            95% { opacity: 0.96; }
            100% { opacity: 0.99; }

        .screen-curve {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9998;

                    document.body.appendChild(canvas);

                    const ctx = canvas.getContext('2d');

                    const columns = canvas.width / fontSize;
                    const drops = Array(Math.floor(columns)).fill(1);

                    function drawMatrix() {
                        ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
                        ctx.fillRect(0, 0, canvas.width, canvas.height);

                        ctx.fillStyle = '#0F0';
                        ctx.font = fontSize + 'px monospace';

                        for (let i = 0; i < drops.length; i++) {
                            const text = chars[Math.floor(Math.random() * chars.length)];
                            ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                            if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                                drops[i] = 0;
                            }
                            drops[i]++;
                        }
                    }

                    const matrixInterval = setInterval(drawMatrix, 33);

                    setTimeout(() => {
                        clearInterval(matrixInterval);
                        canvas.remove();
                        return '<div class="output-line success">You took the red pill. Welcome back.</div>';
                    }, 5000);

                    return '<div class="output-line success">Entering the Matrix... Press ESC to exit</div>';

        function addOutput(text, className = 'response') {
            if (text === null) return;

            const line = document.createElement('div');
            line.className = `output-line ${className}`;
            line.innerHTML = text;
            output.appendChild(line);
            terminal.scrollTop = terminal.scrollHeight;
        }

        function executeCommand(cmd) {
            const trimmedCmd = cmd.trim().toLowerCase();
            const [command, ...args] = trimmedCmd.split(' ');

            addOutput(`<span class="command">visitor@eduardo:~$ ${cmd}</span>`, 'command');

            if (command === '') return;

            if (commands[command]) {
                const result = commands[command].action();
                if (result !== null) {
                    addOutput(result);
                }
            } else {
                addOutput(`<span class="error">Command not found: ${command}. Type 'help' for available commands.</span>`, 'error');
            }
        }

        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                executeCommand(input.value);
                input.value = '';
            }
        });

        terminal.addEventListener('click', () => {
            input.focus();
        });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                document.getElementById('matrix-canvas')?.remove();
            }
        });

        window.addEventListener('load', () => {
            setTimeout(() => {
                addOutput(commands.banner.action());
                addOutput(`<div class="output-line response">Welcome! I'm loading Eduardo's experience...<br>Type 'help' to get started.</div>`);
                input.focus();
            }, 500);
        });
