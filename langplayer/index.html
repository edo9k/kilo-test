<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f172a" />
  <title>LangPlayer</title>
  <script>
    try {
      var saved = JSON.parse(localStorage.getItem("langplayer:v1") || "{}");
      document.documentElement.dataset.theme = saved.theme === "light" ? "light" : "dark";
    } catch (e) {
      document.documentElement.dataset.theme = "dark";
    }
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="shell">
    <div class="header-inner">
      <div class="brand">LangPlayer</div>
      <button class="icon-btn" id="settingsBtn" aria-label="Settings"><img src="icons/settings.png" alt="" width="20" height="20" /></button>
    </div>
  </header>

  <main class="shell">
    <aside class="panel panel-settings" id="settingsPanel">
      <button class="close-btn" id="closeSettings" aria-label="Close settings">&times;</button>
      <h2>Settings</h2>
      <div class="setting-row">
        <label>Auto-skip after <span id="skipVal">3</span> minutes</label>
        <input type="range" id="skipRange" min="1" max="30" step="1" value="3" />
      </div>
      <div class="setting-row">
        <label>Skip the first <span id="startSkipVal">0</span> seconds of each episode</label>
        <input type="range" id="startSkipRange" min="0" max="120" step="1" value="0" />
      </div>
      <div class="setting-row">
        <label>Appearance</label>
        <label class="theme-toggle">
          <input type="checkbox" id="themeToggle" />
          <span class="toggle-track"><span class="toggle-thumb"></span></span>
          <span id="themeLabel">Dark mode</span>
        </label>
      </div>
      <div class="setting-row">
        <label>Enabled languages</label>
        <div class="lang-toggles" id="langToggles"></div>
      </div>
      <div class="setting-row">
        <label class="chip" id="resetBtn">Reset defaults</label>
      </div>
    </aside>

    <div class="player-wrap">
      <div class="player">
        <div class="status" id="status">Ready</div>
        <div class="now-playing">
          <div class="np-art" id="npArt">&#127908;</div>
          <div class="np-info">
            <div class="np-lang" id="npLang">—</div>
            <div class="np-title" id="npTitle">Select a language to begin</div>
            <div class="np-source" id="npSource">—</div>
            <a class="np-link" id="npLink" href="#" target="_blank" rel="noopener noreferrer" hidden>Open full episode ↗</a>
          </div>
        </div>

        <audio id="audio" preload="metadata"></audio>

        <div class="controls">
          <button class="ctrl-btn" id="btnPrev" aria-label="Previous"><img src="icons/prev.png" alt="" width="22" height="22" /></button>
          <button class="ctrl-btn primary" id="btnPlay" aria-label="Play"><img id="playIcon" src="icons/play.png" alt="" width="26" height="26" /></button>
          <button class="ctrl-btn" id="btnNext" aria-label="Next"><img src="icons/next.png" alt="" width="22" height="22" /></button>
          <button class="ctrl-btn" id="btnBack" aria-label="Jump back 10 seconds"><img src="icons/back10.png" alt="" width="22" height="22" /></button>
          <button class="ctrl-btn" id="btnFwd" aria-label="Jump forward 10 seconds"><img src="icons/forward10.png" alt="" width="22" height="22" /></button>
        </div>

        <div class="progress-wrap">
          <input type="range" id="progress" min="0" max="100" value="0" />
          <div class="progress-time">
            <span id="curTime">0:00</span>
            <span id="durTime">0:00</span>
          </div>
        </div>

        <div class="playback-options">
          <label class="speed-control" for="speedSelect">
            <span>Speed</span>
            <select id="speedSelect">
              <option value="0.5">0.5×</option>
              <option value="0.75">0.75×</option>
              <option value="1" selected>1×</option>
              <option value="1.25">1.25×</option>
              <option value="1.5">1.5×</option>
              <option value="1.75">1.75×</option>
              <option value="2">2×</option>
            </select>
          </label>
          <div class="skip-info" id="skipInfo">Auto-skip: off</div>
        </div>

        <div class="episodes" id="episodes">
          <h3>Episodes</h3>
          <div class="episode-list" id="episodeList">Loading…</div>
        </div>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
